[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voigt-kampff"
version = "0.2.0"
description = "Voigt-Kampff — a behavioral safety scoring engine for AI systems. Part of the SAPIEN Framework."
readme = "README.md"
license = "FSL-1.1-ALv2"
# Ship the license + attribution notice in the built distribution (PEP 639).
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    {name = "Callen Sapien", email = "contact@sapienframework.org"},
]
keywords = ["ai-safety", "llm", "benchmark", "evaluation", "drift-detection", "red-team", "behavioral-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "rich>=12.5",
    # Pin to the 1.x line: pre-1.40 lacks the typed exception classes the
    # adapter's retry/auth detection relies on, and a future 2.0 may break
    # the completion() kwargs we pass. Upper bound is intentional.
    #
    # Floor raised to 1.83.7 and 1.82.8 excluded: the 1.82.7/1.82.8 wheels were
    # a compromised supply-chain release (cloud-credential harvester, March
    # 2026); 1.83.7 is the first clean build at/after that window. A loose
    # >=1.40 floor let a rebuild resolve to the poisoned wheel. Only the litellm
    # PROXY SERVER carries the 2026 CVE wave — this project is a library-only
    # consumer of litellm.completion(), so the SDK path is unaffected.
    "litellm>=1.83.7,!=1.82.8,<2",
    # Cinematic boot/verdict layer (display/cinematic.py). Pure-Python, light.
    # The animation degrades gracefully if these are ever absent, but they ship
    # by default so the retro intro is on out of the box.
    "terminaltexteffects>=0.10",
    "pyfiglet>=1.0",
]

[project.scripts]
voigt-kampff = "sapien_score.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sapien_score"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "LICENSE",
    "NOTICE",
    "README.md",
    "pyproject.toml",
]

[project.urls]
Homepage = "https://sapienframework.org"
Repository = "https://github.com/sapiencallenmajin/TheSAPIENFramework"
Issues = "https://github.com/sapiencallenmajin/TheSAPIENFramework/issues"
