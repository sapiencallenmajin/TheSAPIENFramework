version: 2
updates:
  # voigt-kampff CLI (pip / pyproject at sapien-score/)
  - package-ecosystem: "pip"
    directory: "/sapien-score"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors reviewed manually — scoring reproducibility depends on pinned
      # behavior (litellm <2 pin is deliberate; 1.93+ is sdist-only/Rust).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
